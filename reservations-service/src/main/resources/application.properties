spring.application.name=RESERVATIONS-SERVICE

server.port=8084

logging.level.org.springframework.security=DEBUG

Spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/reservations
spring.datasource.username=postgres
spring.datasource.password=postgres

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

resilience4j.retry.instances.slot-service.max-attempts=5
resilience4j.retry.instances.slot-service.wait-duration=2000ms
resilience4j.retry.instances.slot-service.retry-exceptions=java.io.IOException,org.springframework.web.reactive.function.client.WebClientRequestException,\
 it.eng.reservations_service.exception.SlotServiceUnavailableException
resilience4j.retry.instances.slot-service.ignore-exceptions=it.eng.reservations_service.exception.SlotAlreadyReservedInReservationContextException

resilience4j.retry.instances.physio-service.max-attempts=3
resilience4j.retry.instances.physio-service.wait-duration=500ms

resilience4j.circuitbreaker.instances.slot-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.slot-service.sliding-window-size=5
#ide u open stanje kad premasi ovaj procenat
resilience4j.circuitbreaker.instances.slot-service.failure-rate-threshold=20
#cb prelazi u half open nakon sto je istekao "waitDurationInOpenState", nema potrebe da se uputi request osim ako je "automaticTransitionFromOpenToHalfOpenEnabled"=false
resilience4j.circuitbreaker.instances.slot-service.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.slot-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.slot-service.record-exceptions=it.eng.reservations_service.exception.SlotServiceUnavailableException
#java.io.IOException,\
#org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.circuitbreaker.instances.slot-service.ignore-exceptions=\
it.eng.reservations_service.exception.SlotAlreadyReservedInReservationContextException

resilience4j.circuitbreaker.instances.physio-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.physio-service.failure-rate-threshold=60

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.enable.resilience4j=true
management.metrics.distribution.percentiles-histogram.resilience4j.circuitbreaker.calls=true




